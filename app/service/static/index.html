<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indexer</title><link rel="stylesheet" href="/style.css"><script defer src="/refresh.js"></script><script defer src="/app.js"></script></head><body><main><p class="eyebrow">YOUR INDEPENDENT INDEXER</p><h1 id="app">Indexer</h1><p id="message" role="status">Connecting to your index…</p><dl><div><dt>Network</dt><dd id="network">—</dd></div><div><dt>Node height</dt><dd id="nodeHeight">—</dd></div><div><dt>Index height</dt><dd id="indexHeight">—</dd></div><div><dt>Indexed items</dt><dd id="items">—</dd></div></dl><section class="refresh-settings" aria-label="Refresh settings"><label for="refresh-minutes">Refresh interval (minutes)</label><div class="refresh-controls"><input id="refresh-minutes" type="number" min="1" step="1" value="1" inputmode="numeric"><button id="save-refresh" type="button">Save interval</button><button id="refresh" type="button">Refresh status</button></div><p id="refresh-note" class="note" role="status"></p></section></main></body></html>
